# MongoDB Docker Setup for MERN Employee Dashboard

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: employee_dashboard_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: employee_dashboard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - employee_network

  # Optional: MongoDB Express for database administration
  mongo-express:
    image: mongo-express:1.0.0
    container_name: employee_dashboard_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - employee_network

volumes:
  mongodb_data:

networks:
  employee_network:
    driver: bridge