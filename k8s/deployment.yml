# Kubernetes Deployments for MERN Employee Dashboard
# MongoDB Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        component: database
    spec:
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password123"
        - name: MONGO_INITDB_DATABASE
          value: "employee_dashboard"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        - name: mongo-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          limits:
            memory: "1Gi"
            cpu: "500m"
          requests:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: mongo-init
        configMap:
          name: mongo-init-script

---
# PersistentVolumeClaim for MongoDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ConfigMap for MongoDB initialization
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init-script
data:
  mongo-init.js: |
    // MongoDB initialization script
    // Switch to the employee_dashboard database
    db = db.getSiblingDB('employee_dashboard');

    // Create collections with some sample data
    db.createCollection('employees');
    db.createCollection('attendances');

    // Insert sample employees
    db.employees.insertMany([
      {
        name: "John Doe",
        email: "john.doe@company.com",
        position: "Software Developer",
        department: "IT",
        employeeId: "EMP001",
        phone: "+1-555-0123",
        joinDate: new Date("2023-01-15"),
        status: "active",
        createdAt: new Date(),
        updatedAt: new Date()
      },
      {
        name: "Jane Smith",
        email: "jane.smith@company.com",
        position: "Product Manager",
        department: "Marketing",
        employeeId: "EMP002",
        phone: "+1-555-0124",
        joinDate: new Date("2023-02-20"),
        status: "active",
        createdAt: new Date(),
        updatedAt: new Date()
      },
      {
        name: "Mike Johnson",
        email: "mike.johnson@company.com",
        position: "DevOps Engineer",
        department: "IT",
        employeeId: "EMP003",
        phone: "+1-555-0125",
        joinDate: new Date("2023-03-10"),
        status: "active",
        createdAt: new Date(),
        updatedAt: new Date()
      },
      {
        name: "Sarah Wilson",
        email: "sarah.wilson@company.com",
        position: "HR Manager",
        department: "HR",
        employeeId: "EMP004",
        phone: "+1-555-0126",
        joinDate: new Date("2023-01-05"),
        status: "active",
        createdAt: new Date(),
        updatedAt: new Date()
      }
    ]);

    print('✅ Sample employees inserted successfully');

    // Create indexes for better performance
    db.employees.createIndex({ "email": 1 }, { unique: true });
    db.employees.createIndex({ "employeeId": 1 }, { unique: true });
    db.attendances.createIndex({ "employee": 1, "date": 1 }, { unique: true });

    print('✅ Database indexes created successfully');
    print('✅ Employee Dashboard database setup complete!');

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        component: api
    spec:
      containers:
      - name: backend
        image: tuheen27/mern-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: MONGODB_URI
          value: "mongodb://admin:password123@mongodb-service:27017/employee_dashboard?authSource=admin"
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      restartPolicy: Always

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: ui
    spec:
      containers:
      - name: frontend
        image: tuheen27/mern-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://backend-service:5000"
        resources:
          limits:
            memory: "256Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      restartPolicy: Always